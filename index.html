<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111720"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="地下歩き"><meta name="description" content="固定ダンジョンを一手ずつ歩くオフライン試作アプリ"><title>地下歩き · 0.1 暫定版</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./hero.png"><link rel="stylesheet" href="./style.css"></head>
<body><main>
<section class="stage" id="stage" aria-label="固定ダンジョン"><canvas id="map" role="img" aria-label="ダンジョンを準備中"></canvas></section>
<section class="controls" aria-label="移動操作">
<div class="status"><span id="status" role="status" aria-live="polite">準備中…</span><button id="settings" aria-label="保存と設定を開く">設定</button></div>
<p id="notice" role="alert" hidden></p>
<div class="dpad" role="group" aria-label="4方向。一度押すと方向転換、同じ方向を押すと移動">
<button data-direction="up" aria-label="上" class="up">▲</button><button data-direction="left" aria-label="左" class="left">◀</button><button data-direction="right" aria-label="右" class="right">▶</button><button data-direction="down" aria-label="下" class="down">▼</button>
</div></section></main>
<dialog id="dialog"><h1>地下歩き <small>0.1 暫定版</small></h1><p id="offline">オフライン準備を確認中…</p><p id="saved" aria-live="polite">端末保存を確認中…</p><p>違う方向を押すと、その場で向きを変えます。同じ方向を押すと1マス移動します。長押しでの連続移動はありません。</p><p>方向転換と壁への操作はターンを消費しません。勇者の足元の金色の目印と状態欄が、現在の向きを表します。</p><button id="reset">出発地点へ戻す</button><div id="resetConfirm" hidden><p>位置・向き・移動回数を最初に戻します。</p><button id="cancelReset">やめる</button><button id="confirmReset">最初に戻す</button></div><button id="close" class="close">閉じる</button></dialog>
<script type="module" src="./app.js"></script></body></html>
